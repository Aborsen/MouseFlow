# Ежедневный бэкап базы за пределы Neon.
#
# ПОЧЕМУ НЕ АРТЕФАКТОМ. Дамп заливается прямо в ведро и никогда не остаётся в GitHub. Причина конкретная:
# этот репозиторий может перестать быть приватным, а артефакты доступны всем, кто может читать репозиторий.
# Секреты остаются секретами и на публичном репозитории - форкам их не выдают, - поэтому сам этот файл
# публиковать безопасно, а дамп в артефактах был бы утечкой, отложенной до смены видимости.
#
# ЧТО ЭТА ЗАДАЧА МОЖЕТ И ЧЕГО НЕ МОЖЕТ. Шифрование - публичным ключом age, так что она создаёт бэкапы,
# которые не может прочитать. Ключ доступа к ведру выдан без deleteFiles, так что она не может и удалить
# ранее созданные. Устаревшие убирает правило хранения на стороне ведра.
#
# ПЕРВЫЙ ЗАПУСК - РУКАМИ, кнопкой «Run workflow»: расписание проверять нечем, пока ни один запуск не прошёл,
# а «бэкап, который никто не видел работающим» - это надежда, а не бэкап.
name: backup

on:
  schedule:
    # 02:17 UTC. Не в круглый час: в :00 у GitHub очередь из всех расписаний мира, и запуск сдвигается.
    - cron: '17 2 * * *'
  workflow_dispatch:

# contents: read - ровно столько, сколько нужно, и НИ БАЙТА БОЛЬШЕ.
#
# Первый запуск упал именно здесь, с `permissions: {}`: я решил, что задаче не нужен токен репозитория -
# она читает базу и пишет в ведро, - и забыл, что сначала ей надо забрать сам репозиторий. У приватного
# репозитория checkout без contents:read отвечает «repository not found» и git выходит с 128, то есть
# отказ в доступе выглядит как несуществующий репозиторий. Тот же ответ, что и для чужого репозитория, -
# по той же причине, по которой наш /api/docs отвечает 404 на чужой документ.
permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      # pg_dump той же мажорной версии, что сервер, берётся образом внутри скрипта - на раннере есть docker.
      # Здесь ставится только age: он есть в universe и появляется за пару секунд.
      - name: age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: dependencies
        run: npm ci --omit=dev --no-audit --no-fund

      # Какие секреты ВООБЩЕ заданы - до попытки что-либо сделать. Первый неудачный запуск стоил двух
      # кругов ровно потому, что «exit code 1» не отличает «секрета нет» от «ключ не тот».
      #
      # Проверяются ВЫРАЖЕНИЯМИ, а не через toJSON(secrets): второе занесло бы значения всех секретов в
      # переменную окружения ради того, чтобы посмотреть на их имена. Здесь в лог попадает только true/false.
      - name: which secrets are set
        run: |
          echo "DATABASE_URL          ${{ secrets.DATABASE_URL != '' }}"
          echo "BACKUP_S3_ENDPOINT    ${{ vars.BACKUP_S3_ENDPOINT || secrets.BACKUP_S3_ENDPOINT != '' }}"
          echo "BACKUP_S3_BUCKET      ${{ vars.BACKUP_S3_BUCKET || secrets.BACKUP_S3_BUCKET != '' }}"
          echo "BACKUP_S3_KEY_ID      ${{ secrets.BACKUP_S3_KEY_ID != '' }}"
          echo "BACKUP_S3_APP_KEY     ${{ secrets.BACKUP_S3_APP_KEY != '' }}"
          echo "BACKUP_AGE_RECIPIENT  ${{ secrets.BACKUP_AGE_RECIPIENT != '' }}"

      # СПРОСИТЬ ПРОВАЙДЕРА, А НЕ ГАДАТЬ. Четыре запуска подряд проверяли по одной догадке - мастер-ключ,
      # регистр имени, регион, - потому что ошибки S3 намеренно не различают эти случаи. Нативный API B2
      # говорит прямо: к какому ведру привязан ключ, какие у него права и какой S3-endpoint у аккаунта.
      #
      # continue-on-error, чтобы за ОДИН запуск было видно и это, и ответ самой выгрузки: диагностика,
      # которая обрывает круг, стоит ещё одного круга.
      - name: ask Backblaze what this key is
        continue-on-error: true
        env:
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT || secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET || secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          BACKUP_S3_APP_KEY: ${{ secrets.BACKUP_S3_APP_KEY }}
        run: node scripts/backup.mjs --whoami

      - name: back it up
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT || secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET || secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          BACKUP_S3_APP_KEY: ${{ secrets.BACKUP_S3_APP_KEY }}
          # Публичный ключ - не секрет, но лежит рядом с остальными, чтобы не искать его в двух местах.
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: node scripts/backup.mjs

      # Что теперь лежит в ведре - в логе запуска. Полезно ровно в тот день, когда бэкап понадобится:
      # видно, за какие числа он есть, не заходя в консоль Backblaze.
      - name: what is in the bucket
        if: always()
        env:
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT || secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET || secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
          BACKUP_S3_APP_KEY: ${{ secrets.BACKUP_S3_APP_KEY }}
        run: node scripts/backup.mjs --list
