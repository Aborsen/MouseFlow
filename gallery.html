<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MouseFlow — skill gallery</title>
<meta name="description" content="Browse and install MouseFlow skills people have shared.">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- A direct entry point for the gallery, kept because the extension's Publish button links straight
     here and a shared link should not depend on which tab someone was last on. The gallery itself is
     one implementation, mounted in both places - see gallery-view.js. -->
<header class="topbar">
  <a class="brand" href="/">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 3l14 8-6 1.6L10.5 19z" fill="currentColor"/>
    </svg>
    <span>MouseFlow</span>
  </a>
  <nav class="tabs">
    <a class="tab" href="/#desktop">Desktop</a>
    <a class="tab" href="/#skills">Skills</a>
    <a class="tab tab--on" href="/gallery.html">Gallery</a>
  </nav>
</header>

<main>
  <section class="card card--wide" id="gallery-root"></section>
</main>

<script type="module">
  import { mountGallery } from './gallery-view.js';
  mountGallery(document.getElementById('gallery-root'));
</script>
</body>
</html>
